# Configuration of run_location_importance.py. Paths are relative to this file.

output_directory: results/importance

seed: 42                  # folds, model and the train split used for the IMPresseD selection
folds: 5                  # cross-validation folds (as in the paper)
repetitions: 10           # location permutations per itemset and fold (as in the paper)
constrain: true           # feasibility constraint: only observed locations
evaluate_on: train       # train = like the reference code; test = F1 drop on the held-out cases of each fold
exact_tracking: false     # false = literal port of the reference shuffle (off-by-one in its bookkeeping)
accumulate_permutations: false  # true = like the reference code, which never resets the permuted traces
test_size: 0.2            # share of cases kept out of the IMPresseD selection (select_on: training_split)

columns:
  case: case:concept:name
  activity: concept:name
  label: label
  order: event_nr

datasets:
  - name: BPIC11_f1
    path: data/BPIC11_f1_trunc36.csv
    case_attributes:
      numeric: [Age]
      categorical: [Diagnosis, Diagnosis code, Specialism code, Treatment code]
  - name: synthetic
    path: data/synthetic/synthetic.csv
    case_attributes: {numeric: [Age], categorical: [Category]}
  - name: shuffled_within_case
    path: data/synthetic/shuffled_within_case.csv
    case_attributes: {numeric: [Age], categorical: [Category]}
  - name: shuffled_outcomes
    path: data/synthetic/shuffled_outcomes.csv
    case_attributes: {numeric: [Age], categorical: [Category]}

# select_on: all             -> itemsets from all cases (the paper: Apriori ignores the labels)
#            training_split  -> itemsets from the training part only (IMPresseD uses the labels)
strategies:
  - name: apriori
    type: apriori
    select_on: all
    min_support: 0.5
    top_k: 10
    max_length: 3
    singletons: all
  - name: impressed
    type: impressed
    select_on: training_split
    max_pattern_length: 3
    extend_eventual_patterns: false
