# Configuration of the itemset selection experiments.
# All paths are relative to this file.

seed: 42                 # random seed for the train/test split and the simulated logs
test_size: 0.2           # share of cases held out; itemsets are selected on the rest
output_directory: results

# Column names in the CSV event logs (BPIC11 files of Vazifehdoostirani et al.).
columns:
  case: case:concept:name
  activity: concept:name
  label: label
  order: event_nr

# Case-level attributes for the case-distance interest function of IMPresseD.
case_attributes:
  numeric: [Age]
  categorical: [Diagnosis, Diagnosis code, Specialism code, Treatment code]

datasets:
  - name: BPIC11_f1
    path: data/BPIC11_f1_trunc36.csv
  - name: BPIC11_f2
    path: data/BPIC11_f2_trunc40.csv
  - name: BPIC11_f3
    path: data/BPIC11_f3_trunc31.csv

# Strategies that choose the itemsets. The first one is the reference that the
# others are compared with.
strategies:
  # Baseline of the original paper: Apriori with the default settings of the authors.
  - name: apriori
    type: apriori
    min_support: 0.5     # fraction of cases that must contain the itemset
    top_k: 10            # number of multi-activity itemsets that are kept
    max_length: 3        # largest itemset size (same as the IMPresseD variant)
    singletons: all      # all | frequent | none
  # Sensitivity of the baseline: lower support, more itemsets.
  - name: apriori_support0.2_top25
    type: apriori
    min_support: 0.2
    top_k: 25
    max_length: 3
    singletons: all
  # Variant: pattern extraction of IMPresseD (Pareto front of the interest functions).
  - name: impressed
    type: impressed
    max_pattern_length: 3  # pattern lengths 1, 2 and 3
    extend_eventual_patterns: false

# Simulated logs in which the location of activities determines the outcome.
simulation:
  repetitions: 10        # logs per scenario, with seeds seed, seed+1, ...
  case_attributes:
    numeric: [Age]
    categorical: [Category]
  scenarios:
    - name: SIM_rare_pair       # the pair P,Q occurs in 30% of the cases
      share_with_pair: 0.3
    - name: SIM_frequent_pair   # the pair P,Q occurs in 60% of the cases
      share_with_pair: 0.6
